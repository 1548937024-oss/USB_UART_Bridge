project:
  name: USB_UART_Bridge
  revision: 0.2
  last_updated: 2026-09-19
  status: requirements_baseline
  purpose: 提供一块隔离型 USB 2.0 转 3.3 V UART 接口板，用于 5 Mbps 以内连续全双工通信，并提供可切换的隔离参考电源输出。

scope:
  in_scope:
    - USB-C 供电与 USB 2.0 全速设备接口
    - USB 转 UART 桥接
    - TXD 与 RXD 双通道数字隔离
    - 隔离侧 5 V 转 3.3 V 电源
    - 隔离参考电源 3.3 V / 5 V 选择输出
    - 2 层原型 PCB 的原理图、布局、布线、验证和制造输出流程
  out_of_scope:
    - USB D+/D- 数据线隔离
    - DTR、RTS、CTS、DSR 等调制解调器控制信号
    - 5 V UART 逻辑电平输出
    - 外部直流电源输入
    - EMC、安规、热设计和高速信号完整性的最终认证
    - 量产测试工装和生产许可

assumptions:
  - USB 主机端口能够提供至少 500 mA、4.5 V 至 5.5 V 的 VBUS。
  - 外部 UART 设备接受 3.3 V CMOS/TTL 逻辑。
  - 隔离参考电源 PWR_VOUT_ISO 的总负载不超过 100 mA。
  - 板卡定位为首版工程原型，不直接用于量产或安全认证场景。
  - KiCad 10.0、kicad-cli、pcbnew 和项目内脚本是原理图与 PCB 的受控设计环境。

requirements:
  functional:
    - id: FR-001
      title: USB 2.0 设备接口
      priority: must
      statement: 板卡应通过 J1 USB-C 接口作为 USB 2.0 全速设备与主机连接，并仅使用 USB 2.0 数据引脚。
      acceptance:
        - USB-C 接口包含 VBUS、GND、D+、D- 和 CC 连接。
        - USB 3.x SuperSpeed 引脚不使用，并明确标记 no-connect 或按连接器规范处理。
        - 主机能够枚举 USB-UART 桥接设备。
      verification: [原理图审查, USB 枚举测试]
      release_gates: [G3, G4, G6]

    - id: FR-002
      title: USB 转 UART 桥接
      priority: must
      statement: 板卡应把 USB CDC/VCP 数据流转换为 UART TXD/RXD 数据流。
      acceptance:
        - USB 侧数据能够通过桥接器发送到 UART TXD。
        - UART RXD 数据能够返回主机并被正确接收。
        - USB 侧和 UART 侧不共享隔离区域之外的逻辑电平。
      verification: [功能测试, 回环测试]
      release_gates: [G5, G6]

    - id: FR-003
      title: UART 速率
      priority: must
      statement: UART 通道应支持连续全双工通信，目标速率至少为 5 Mbps。
      acceptance:
        - 在 5 Mbps 下连续双向传输时，误码率为 0。
        - 测得的 TXD 和 RXD 波形无功能性丢码、毛刺或明显振铃。
        - 桥接器和数字隔离器的额定速率均高于 5 Mbps。
      verification: [5 Mbps 回环测试, 误码统计, 示波器检查]
      release_gates: [G5, G6, G8]

    - id: FR-004
      title: UART 逻辑电平
      priority: must
      statement: TXD 和 RXD 应固定使用 3.3 V 逻辑，不应因 PWR_VOUT_ISO 选择 5 V 而改变。
      acceptance:
        - 隔离侧 UART I/O 供电为 PWR_3V3_ISO。
        - JP1 切换 3.3 V 或 5 V 时，TXD/RXD 高低逻辑阈值保持不变。
        - 不提供从隔离 5 V 直接驱动 UART 信号的通路。
      verification: [原理图审查, 电压测量, 回环测试]
      release_gates: [G3, G5, G6]

    - id: FR-005
      title: 隔离 UART 通道
      priority: must
      statement: TXD 和 RXD 应分别通过数字隔离器跨过隔离栅，任何 USB 侧 UART 信号不得与隔离侧 UART 信号直接铜连接。
      acceptance:
        - U1 与 J2 之间只存在经过 U3 的 TXD/RXD 数据路径。
        - UART_TX_BRIDGE、UART_TX_ISO_IN、UART_TX_ISO_OUT 的电气关系正确。
        - UART_RX_ISO_IN、UART_RX_ISO_OUT、UART_RX_BRIDGE 的电气关系正确。
        - GND 与 ISO_GND 在任何层均不连通。
      verification: [网表审查, ERC, 连通性测试, 隔离测试]
      release_gates: [G3, G5, G6]

    - id: FR-006
      title: 隔离参考电源输出选择
      priority: must
      statement: J2 第 2 脚 PWR_VOUT_ISO 应通过 JP1 选择 PWR_3V3_ISO 或 PWR_5V_ISO，默认状态为 3.3 V。
      acceptance:
        - JP1 2-3 短接时 J2.2 输出 PWR_3V3_ISO。
        - JP1 1-2 短接时 J2.2 输出 PWR_5V_ISO。
        - 未安装跳线时 J2.2 不连接到任一电源轨，并在装配说明中明确其为高阻状态。
        - JP1 的默认配置在原理图、BOM、装配图和丝印上保持一致。
      verification: [原理图审查, 装配检查, 电压测量]
      release_gates: [G3, G4, G6, G7]

    - id: FR-007
      title: UART 输出连接器
      priority: must
      statement: J2 应为 1x4、2.54 mm 弯针，布置在板卡最右侧，引脚顺序固定为 ISO_GND、PWR_VOUT_ISO、RXD、TXD。
      acceptance:
        - 引脚 1 为 ISO_GND。
        - 引脚 2 为 PWR_VOUT_ISO。
        - 引脚 3 为板卡 RXD 输入。
        - 引脚 4 为板卡 TXD 输出。
        - J2 和 JP1 采用卧式弯针，金属引脚伸出板外，便于插拔杜邦线。
        - J2 和 JP1 在 PCB 最右侧上下并排，间距在满足装配和丝印要求的前提下尽量缩小。
        - 丝印和装配文件中的方向与实际引脚一致。
      verification: [原理图审查, PCB 检查, 万用表连通性测试]
      release_gates: [G3, G4, G6]

    - id: FR-008
      title: 状态指示
      priority: must
      statement: 板卡应至少提供 USB 侧电源状态和 USB-UART 活动状态指示。
      acceptance:
        - VBUS 正常且桥接器 3.3 V 电源建立后，电源 LED 点亮。
        - 桥接器提供活动状态输出时，活动 LED 按设计逻辑闪烁或点亮。
        - LED 不改变 UART 信号网逻辑，不与隔离侧电源域冲突。
      verification: [原理图审查, 上电测试, 通信测试]
      release_gates: [G4, G6]

    - id: FR-009
      title: 调试测试点
      priority: must
      statement: 板卡应提供 PWR_5V_USB、PWR_3V3_ISO、UART_TX_ISO_OUT 和 UART_RX_ISO_IN 测试点。
      acceptance:
        - TP1 可测 PWR_5V_USB。
        - TP2 可测 PWR_3V3_ISO。
        - TP3 可测隔离侧 TXD。
        - TP4 可测隔离侧 RXD。
        - 测试点不形成额外残桩或破坏高速/隔离布线要求。
      verification: [原理图审查, PCB 检查, 上电测量]
      release_gates: [G3, G4, G6]

    - id: FR-010
      title: 控制信号裁剪
      priority: must
      statement: 本版本不应暴露 DTR、RTS、CTS、DSR 或其他未要求的 UART 流控信号。
      acceptance:
        - J2 不包含上述控制信号。
        - 桥接器未使用引脚已明确标记 no-connect 或按数据手册要求处理。
        - 原理图中不存在未说明的悬空输入。
      verification: [原理图审查, ERC, 网表审查]
      release_gates: [G3, G6]

  electrical:
    - id: ER-001
      title: USB 输入电压范围
      priority: must
      statement: 板卡应由 USB VBUS 供电，在 4.5 V 至 5.5 V 输入范围内正常工作。
      acceptance:
        - PWR_5V_RAW 直接来自 USB VBUS。
        - 保护器件和桥接器均在输入范围内满足数据手册限制。
        - 输入极性和过压保护边界在原理图中明确。
      verification: [原理图审查, 数据手册核对, 电源测试]
      release_gates: [G3, G6]

    - id: ER-002
      title: 电源域
      priority: must
      statement: 板卡应建立 PWR_5V_RAW、PWR_5V_USB、PWR_3V3_USB、PWR_5V_ISO、PWR_3V3_ISO、PWR_VOUT_ISO、GND 和 ISO_GND 电源网络。
      acceptance:
        - USB 侧电源由 PWR_5V_RAW 经保护后形成 PWR_5V_USB。
        - PWR_3V3_USB 由 USB-UART 桥接器产生。
        - PWR_5V_ISO 由隔离 DC/DC 产生。
        - PWR_3V3_ISO 由隔离 LDO 从 PWR_5V_ISO 产生。
        - 所有电源符号和网络命名在全工程中保持一致。
      verification: [原理图审查, ERC, 电源上电测试]
      release_gates: [G3, G4, G6]

    - id: ER-003
      title: 隔离输出电压与负载
      priority: must
      statement: PWR_VOUT_ISO 应支持 3.3 V 或 5.0 V 选择，并按 100 mA 最大总负载设计。
      acceptance:
        - 3.3 V 和 5.0 V 两种配置在 100 mA 负载下均保持输出电压在设计容差内。
        - 隔离 DC/DC 和 LDO 的额定能力覆盖该负载及自身功耗。
        - UART 逻辑电平不受该负载选择影响。
      verification: [负载测试, 温升检查, 电源测试]
      release_gates: [G4, G6, G8]

    - id: ER-004
      title: 隔离等级目标
      priority: must
      statement: 隔离栅目标耐压等级为 1.5 kVrms，耐压测试持续时间为 60 s。
      acceptance:
        - 未装配耐压测试前，隔离器件、隔离电源和 PCB 间距均按 1.5 kVrms 目标设计。
        - 耐压测试不能在板卡未清理、未干燥或不符合测试条件时执行。
        - 测试记录包含电压、持续时间、漏电流和环境条件。
      verification: [安全间距审查, 隔离耐压测试]
      release_gates: [G4, G6, G8]

    - id: ER-005
      title: 隔离爬电距离
      priority: must
      statement: 隔离带内任意导电路径的爬电距离应不小于 5 mm，专门用于跨越隔离栅的隔离器件除外。
      acceptance:
        - 顶层、底层和板边的隔离带间距均不小于 5 mm。
        - 隔离器件、隔离电源和安装孔附近的间距单独审查。
        - DRC 自定义规则和人工测量结果一致。
      verification: [PCB 几何检查, DRC, 人工测量]
      release_gates: [G4, G6]

    - id: ER-006
      title: 隔离带禁布
      priority: must
      statement: GND 与 ISO_GND 之间不得存在铜皮、走线、过孔、焊盘或其他导电结构跨越隔离带，隔离器件内部跨越除外。
      acceptance:
        - GND 和 ISO_GND 铺铜完全分离。
        - 除隔离器件封装本体的必要焊盘外，没有跨带铜结构。
        - 自动布线和铺铜不会侵入隔离带 keepout。
      verification: [PCB 几何检查, DRC, 人工审图]
      release_gates: [G4, G5, G6]

    - id: ER-007
      title: 隔离开槽建议
      priority: should
      statement: 在机械和结构允许时，应在隔离带下设置板边开槽，以提高爬电距离和隔离可靠性。
      acceptance:
        - 如果设置开槽，槽宽、槽长和板边余量满足制造规则。
        - 开槽不削弱连接器、安装孔或板卡机械强度。
        - 不设置开槽时，应在设计评审中记录理由。
      verification: [结构审查, 制造规则检查]
      release_gates: [G4, G7]

    - id: ER-008
      title: 去耦与电源回路
      priority: must
      statement: 每个 IC 的电源引脚应配置满足数据手册要求的去耦电容，并尽量靠近对应电源和地引脚。
      acceptance:
        - 桥接器、隔离器、隔离电源和 LDO 均满足数据手册去耦要求。
        - 高频去耦和体去耦共存时，二者布局位置合理。
        - 电源回路不跨越隔离带。
      verification: [原理图审查, PCB 布局审查, DRC]
      release_gates: [G3, G4, G6]

    - id: ER-009
      title: USB 数据线隔离边界
      priority: must
      statement: USB D+、D- 不做电气隔离，隔离栅应位于 USB-UART 桥接器与外部 UART 接口之间。
      acceptance:
        - USB D+、D- 仅在 USB 侧连接 J1、ESD 保护和桥接器。
        - USB 数据线不存在跨隔离栅的导电结构。
        - 设计文档明确说明 USB 数据线不隔离的原因和限制。
      verification: [架构审查, 原理图审查, PCB 隔离带检查]
      release_gates: [G2, G3, G4, G6]

    - id: ER-010
      title: 隔离电源跨带布置
      priority: must
      statement: PS1 的第 1/2 脚应位于 USB 侧，第 3/4 脚应位于隔离侧，并在两组引脚之间设置实际板槽。
      acceptance:
        - PS1 的 1/2 脚不在隔离侧铺铜中。
        - PS1 的 3/4 脚不在 USB 侧铺铜中。
        - 引脚组之间的板槽位于隔离带内，且不被走线、过孔或铜皮跨越。
        - 槽宽、槽长和槽端圆角满足制造评审要求。
      verification: [PCB 几何检查, DRC, 人工测量]
      release_gates: [G4, G5, G6, G7]

  mechanical:
    - id: ME-001
      title: 板卡尺寸
      priority: must
      statement: PCB 外形尺寸目标为 55 mm x 32 mm。
      acceptance:
        - 板框尺寸在制造公差内满足机械约束。
        - 板框四角倒圆角，推荐半径为 2.0 mm。
        - 连接器、安装孔和板边间距不冲突。
      verification: [PCB 尺寸测量, 机械装配检查]
      release_gates: [G4, G7]

    - id: ME-002
      title: 板厚与叠层
      priority: must
      statement: PCB 应为 2 层、1.6 mm 板厚、1 oz 铜厚。
      acceptance:
        - 叠层设置为 2 层。
        - 板厚为 1.6 mm。
        - 外层铜厚为 1 oz。
      verification: [PCB stackup 审查, 制造文件审查]
      release_gates: [G4, G7]

    - id: ME-003
      title: 安装孔
      priority: must
      statement: 板卡应提供 4 个 M2 安装孔，靠近四角布置，并保证左侧能同时容纳 J1 和两个角部安装孔。
      acceptance:
        - 安装孔数量为 4。
        - 四个安装孔分别靠近 PCB 四个边角。
        - 孔径和禁布区满足 M2 螺钉及装配工具要求。
        - 左侧 J1 与两个左侧安装孔无 courtyard 重叠。
        - 安装孔不侵入隔离带。
      verification: [PCB 检查, 机械装配检查]
      release_gates: [G4, G7]

    - id: ME-004
      title: 连接器方向
      priority: must
      statement: USB-C 连接器应位于板卡最左侧，UART 和输出选择排针应采用 2.54 mm 弯针并位于板卡最右侧。
      acceptance:
        - J1 的插拔方向与机械壳体或线缆要求一致。
        - J2 和 JP1 从板卡右侧水平出线。
        - J2 的 1 脚位置在丝印和装配图中清晰可见。
        - 连接器不超出板框或与安装孔重叠。
      verification: [PCB 检查, 3D 装配检查]
      release_gates: [G4, G7]

    - id: ME-005
      title: 关键连接器 3D 模型
      priority: must
      statement: J1 和 PS1 应提供可用于机械装配检查的 3D 模型；模型为近似件时必须明确标记并在机械发布前替换或确认。
      acceptance:
        - PCB 或封装中引用的 3D 模型能够被 KiCad 3D Viewer 加载。
        - PS1 的近似模型已按 LS/SIP-4 封装尺寸进行缩放和定位。
        - 近似模型与实物尺寸差异完成人工确认。
        - 最终装配发布使用 XKB/YLPTEC 官方模型或经验证的等效模型。
      verification: [3D Viewer 检查, 机械干涉检查, 模型来源审查]
      release_gates: [G4, G7]

  pcb:
    - id: PCB-001
      title: 制造规则
      priority: must
      statement: PCB 应满足 `pcb_design_rules.yaml` 中的目标制造工艺、最小线宽、间距和钻孔要求。
      acceptance:
        - 最小线宽不小于 0.20 mm。
        - 最小间距不小于 0.20 mm。
        - 最小钻孔不小于 0.30 mm。
        - 未使用小于制造最小值的特殊工艺，除非单独评审并记录。
      verification: [DRC, 制造规则审查]
      release_gates: [G4, G6, G7]

    - id: PCB-002
      title: 表面处理
      priority: must
      statement: 表面处理应采用无铅 HASL。
      acceptance:
        - Gerber 和制造说明指定无铅 HASL。
        - 不混用需要不同表面处理的装配要求。
      verification: [制造文件审查]
      release_gates: [G7]

    - id: PCB-003
      title: 独立铺铜
      priority: must
      statement: GND 与 ISO_GND 应在隔离侧独立铺铜，不得合并为同一铜皮或同一网络。
      acceptance:
        - 顶层和底层的 GND、ISO_GND 铜皮在隔离带处完全断开。
        - 过孔缝合只存在于各自接地域内。
        - 铜皮重填后不出现跨隔离带的铜桥。
      verification: [铜皮检查, DRC, 连通性测试]
      release_gates: [G4, G5, G6]

    - id: PCB-004
      title: USB 差分对
      priority: must
      statement: USB D+、D- 应优先采用短距离、同层、等长布线，并保持参考平面连续。
      acceptance:
        - 差分阻抗目标为 90 ohm，容差为 +/-10%。
        - 长度失配不超过 5 mm。
        - 差分对不跨越隔离带。
        - 差分对尽量避免过孔、残桩和参考平面开槽。
      verification: [PCB 几何检查, 阻抗计算, DRC]
      release_gates: [G5, G6]

    - id: PCB-005
      title: 隔离电源与 LDO 去耦布局
      priority: must
      statement: 隔离电源输入、输出和 LDO 去耦电容应靠近对应器件放置。
      acceptance:
        - C7/C8 靠近隔离电源输入和输出。
        - C9/C10 靠近 LDO 输出和隔离侧 3.3 V 负载入口。
        - 去耦回路面积尽量小，不跨越隔离带。
      verification: [PCB 布局审查, DRC]
      release_gates: [G4, G6]

    - id: PCB-006
      title: USB ESD 防护回路
      priority: must
      statement: U2 应紧邻 J1 放置，优先保证 USB D+/D- 到 ESD 器件的电流回路最短。
      acceptance:
        - U2 位于 J1 与 USB-UART 桥接器之间。
        - U2 到 J1 的 USB 数据引脚路径短于到桥接器的路径。
        - D+/D- 布线不得绕行经过其他功能模块。
      verification: [PCB 布局审查, 布线长度检查]
      release_gates: [G4, G5, G6]

    - id: PCB-007
      title: 载流能力
      priority: must
      statement: 电源和地网络的线宽、铜皮和过孔数量应按 IPC-2152 进行载流复核。
      acceptance:
        - 默认载流假设写入 `pcb_design_rules.yaml`。
        - 所有电源网络完成线宽和过孔电流核算。
        - 2 层板的回流路径使用连续铜皮或等效导体。
      verification: [IPC-2152 计算, 铜皮审查, 温升评估]
      release_gates: [G5, G6, G8]

    - id: PCB-008
      title: 回流路径
      priority: must
      statement: 高速信号、电源和隔离信号应具有明确且连续的返回路径。
      acceptance:
        - USB D+/D- 不跨越 GND 平面缺口。
        - 信号换层时返回过孔距离不超过 5 mm。
        - GND 与 ISO_GND 的返回路径完全分开。
      verification: [PCB 几何检查, 回流路径审查]
      release_gates: [G5, G6]

    - id: PCB-009
      title: 2 层阻抗验证
      priority: must
      statement: 2 层板的 USB 90 ohm 差分阻抗必须通过实际叠层计算和首板测量验证。
      acceptance:
        - 阻抗计算使用实际介质厚度、铜厚和阻焊参数。
        - 首板使用 TDR 或网络分析仪验证差分阻抗。
        - 2 层无法满足时升级为 4 层或重新布置 USB 接口。
      verification: [阻抗计算, TDR 测试]
      release_gates: [G5, G6, G8]

  verification:
    - id: VER-001
      title: ERC
      priority: must
      statement: 原理图必须通过 ERC，且不得通过排除项隐藏真实设计问题。
      acceptance:
        - 未排除错误数为 0。
        - 未排除警告数逐条完成人工确认。
        - ERC 报告以 JSON 形式归档。
      verification: [kicad-cli sch erc]
      release_gates: [G3, G8]

    - id: VER-002
      title: DRC 与原理图一致性
      priority: must
      statement: PCB 必须通过 DRC 和原理图一致性检查，且铜皮为最新填充状态。
      acceptance:
        - 未排除 DRC 错误数为 0。
        - 原理图与 PCB 不存在未解释的一致性问题。
        - 铜皮重填后连通性和间距仍满足要求。
      verification: [kicad-cli pcb drc --schematic-parity --refill-zones]
      release_gates: [G6, G8]

    - id: VER-003
      title: UART 回环测试
      priority: must
      statement: 5 Mbps 连续全双工回环测试应无丢包和误码。
      acceptance:
        - 测试持续时间和测试数据量足以验证连续通信。
        - 误码率为 0。
        - 测试记录包含控制器、驱动、线缆和测试夹具信息。
      verification: [回环测试, 误码统计]
      release_gates: [G5, G6, G8]

    - id: VER-004
      title: 隔离与接地测试
      priority: must
      statement: 板卡应验证 USB 侧和隔离侧的电源、地和 UART 通道完全隔离。
      acceptance:
        - GND 与 ISO_GND 之间不存在低阻通路。
        - TXD/RXD 不绕过隔离器。
        - 耐压测试满足 1.5 kVrms、60 s 的目标。
      verification: [绝缘电阻测试, 耐压测试, 连通性测试]
      release_gates: [G6, G8]

    - id: VER-005
      title: 制造输出完整性
      priority: must
      statement: 发布包应包含 Gerber、钻孔、坐标、BOM、原理图 PDF 和 STEP。
      acceptance:
        - Gerber 与钻孔文件可由独立 Gerber 查看器打开。
        - 器件坐标和 BOM 的位号、封装、方向一致。
        - STEP 与 PCB 外形、连接器和安装孔一致。
      verification: [制造文件审查, Gerber 查看器, STEP 检查]
      release_gates: [G7, G8]

    - id: VER-006
      title: 可复现性
      priority: must
      statement: 从干净目录应能通过脚本重新生成网表、BOM、ERC、DRC 和制造输出。
      acceptance:
        - 生成和验证命令记录在 README 或脚本入口中。
        - 源文件、报告和制造输出一并归档。
        - 人工优化已回写到生成器或工程源数据，不只存在于最终生成物。
      verification: [干净环境复现, 文件哈希检查, Git 审查]
      release_gates: [G8]

    - id: VER-007
      title: 变更控制
      priority: must
      statement: 每个发布版本应有唯一修订号、日期、作者和变更说明。
      acceptance:
        - 原理图标题栏和图纸修订表版本一致。
        - README、requirements.yaml 和 design_intent.yaml 的版本一致。
        - Git 提交能够追溯到对应的验证报告和制造输出。
      verification: [版本字段检查, Git 审查]
      release_gates: [G8]

frozen_design_constraints:
  description: 以下内容是已确认的实现基线，不是新增功能需求；变更时需要重新执行架构和验证评审。
  components:
    usb_bridge: CH343G
    digital_isolator: ISO7721D
    isolated_dcdc: IB0505LS-1WR3
    isolated_ldo: AP2112K-3.3
    usb_esd: USBLC6-2SC6
    usb_connector: USB-C USB 2.0 16P
    uart_connector: 1x4 2.54 mm 卧式弯针
    output_selector: 1x3 2.54 mm 卧式弯针
  electrical:
    bridge_max_uart_mbps: 6
    isolator_max_mbps: 100
    isolated_power_w: 1
    isolated_output_max_ma: 100
    usb_data_isolated: false
    uart_logic_v: 3.3
  manufacturing:
    process: 2-layer FR4 prototype
    copper_oz: 1
    surface_finish: lead-free HASL

